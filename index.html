<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Wire Order Entry Form</h1>
            <p>Fill out the specifications below to generate your supplier order.</p>
        </header>

        <main>
            <form id="wireOrderForm">
                <div class="form-group">
                    <label for="wireRouteName">Wire Route Name</label>
                    <input type="text" id="wireRouteName" placeholder="e.g., panel 1" required>
                </div>

                <div class="form-group">
                    <label for="wireSize">Wire Size</label>
                    <select id="wireSize" required>
                        <option value="">Select Wire Size</option>
                        <option value="#12">#12</option>
                        <option value="#10">#10</option>
                        <option value="#8">#8</option>
                        <option value="#6">#6</option>
                        <option value="#4">#4</option>
                        <option value="#3">#3</option>
                        <option value="#2">#2</option>
                        <option value="#1">#1</option>
                        <option value="1/0">1/0</option>
                        <option value="2/0">2/0</option>
                        <option value="3/0">3/0</option>
                        <option value="4/0">4/0</option>
                        <option value="250 MCM">250 MCM</option>
                        <option value="500 MCM">500 MCM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="wireType">Wire Type</label>
                    <select id="wireType" required>
                        <option value="">Select Wire Type</option>
                        <option value="XHHW-2">XHHW-2</option>
                        <option value="THHN/THWN-2">THHN/THWN-2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="wireLength">Wire Length (ft)</label>
                    <input type="number" id="wireLength" placeholder="e.g., 150" required>
                </div>

                <div class="form-group">
                    <label for="wireColors">Wire Colors</label>
                    <select id="wireColors" required>
                        <option value="">Select Color Configuration</option>
                        <option value="3-wire: B/R/B">3-wire: B/R/B</option>
                        <option value="3-wire: B/R/B/G">3-wire: B/R/B/G</option>
                        <option value="3-wire: B/O/Y">3-wire: B/O/Y</option>
                        <option value="3-wire: B/O/Y/G">3-wire: B/O/Y/G</option>
                        <option value="4-wire: B/R/B/W">4-wire: B/R/B/W</option>
                        <option value="4-wire: B/R/B/W/G">4-wire: B/R/B/W/G</option>
                        <option value="4-wire: B/O/Y/GRAY">4-wire: B/O/Y/GRAY</option>
                        <option value="4-wire: B/O/Y/GRAY/G">4-wire: B/O/Y/GRAY/G</option>
                    </select>
                </div>

                <div class="form-group hidden" id="greenWireSizeGroup">
                    <label for="greenWireSize">Green Wire Size</label>
                    <input type="text" id="greenWireSize" placeholder="e.g., #6 AWG">
                </div>

                <button type="submit" class="submit-btn">Generate Order</button>
            </form>

            <div id="outputSection" class="hidden">
                <h2>Generated Order Summary</h2>
                <textarea id="orderSummaryText" readonly></textarea>
                <button id="copyBtn" class="copy-btn">Copy Order to Clipboard</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
